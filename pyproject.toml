[project]
name = "pareidolia"
version = "0.1.0"
description = "Live webcam overlay that finds hidden outlines of a chosen object (oriented chamfer matching)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "numba>=0.60",
]

[project.scripts]
pareidolia = "pareidolia.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pareidolia"]
